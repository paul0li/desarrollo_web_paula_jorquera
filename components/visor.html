<!-- Visor de imágenes -->
<div id="visor" class="foto-visor">
    <div class="visor-contenido">
        <button class="cerrar-visor" onclick="document.getElementById('visor').style.display='none'">
            <span>&times;</span>
        </button>
        <div class="imagen-container">
            <img id="imgGrande" src="" alt="Foto de la actividad" />
        </div>
        <div class="controles">
            <button id="prevFoto" class="nav-btn" title="Foto anterior">&lt;</button>
            <span id="fotoIndicador">1 de 3</span>
            <button id="nextFoto" class="nav-btn" title="Siguiente foto">&gt;</button>
        </div>
    </div>
</div>
